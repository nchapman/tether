[package]
name = "tether-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codec trait + ffmpeg-backed encoders/decoders (H.264 first, HEVC and AV1 planned)."

[dependencies]
tether-protocol = { workspace = true }
tether-capture = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

# NOTE: original plan was rsmpeg (safe hwcontext wrappers), but rsmpeg
# 0.18 is built against the FFmpeg 8.0 ABI and the installed FFmpeg 8.1
# moved a few struct fields (`oformat` -> method, `pb` -> `io_context`).
# ffmpeg-next 8.1.0 auto-detects FFmpeg version. We lose safe hwcontext
# bindings (HW encoders / DMA-BUF import need raw `ffmpeg-sys-next` FFI),
# which is the task #9 follow-up. Software libx264 works without them.
# Migrate back to rsmpeg once it ships FFmpeg 8.1 support.
ffmpeg-next = "8.1"

[lints]
workspace = true
