[workspace]
resolver = "2"
members = [
    "crates/tether-protocol",
    "crates/tether-transport",
    "crates/tether-capture",
    "crates/tether-codec",
    "crates/tether-input",
    "crates/tether-render",
    "apps/tether-host",
    "apps/tether-client",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
tether-protocol = { path = "crates/tether-protocol" }
tether-transport = { path = "crates/tether-transport" }
tether-capture = { path = "crates/tether-capture" }
tether-codec = { path = "crates/tether-codec" }
tether-input = { path = "crates/tether-input" }
tether-render = { path = "crates/tether-render" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal"] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"

[profile.dev]
opt-level = 1
debug = "full"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"

