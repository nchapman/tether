[package]
name = "tether-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Screen capture trait + per-platform backends (ScreenCaptureKit on macOS, PipeWire+portal on Linux)."

[dependencies]
tether-protocol = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }

[features]
# Opts in fakes used by integration tests in downstream crates. Empty
# default features means production builds never carry this code; tests
# enable it via `[dev-dependencies] tether-capture = { ..., features =
# ["test-support"] }`. Mirrors the `test-support` pattern established
# by `tether-transport`.
#
# CI guards against this feature leaking into a non-`[dev-dependencies]`
# slot — see `make check`.
test-support = []

[target.'cfg(target_os = "macos")'.dependencies]
# Safe SCK bindings — wraps Apple's framework via the doom-fish Swift
# FFI shim. `macos_14_0` exposes `SCStreamConfiguration.captureResolution`,
# which we pin to `.best` for crisp Retina capture before SCK downscales to
# the client viewport.
screencapturekit = { version = "6", features = ["macos_14_0"] }
# Need tokio's `task::spawn_blocking` to run SCK's synchronous
# `SCShareableContent::get` off the async runtime. The Linux target
# pulls tokio via ashpd; macOS pulls it explicitly.
tokio = { workspace = true }
# Objective-C runtime for `cursor_macos`: NSCursor / NSImage /
# NSBitmapImageRep are AppKit classes that don't have a binding crate
# we already depend on, so we drive them through raw `msg_send!`.
objc2 = "0.6.3"
# `dlsym` for weak-linking the private `CGSCurrentCursorSeed` symbol.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10"
# v0_3_33 gates PropertyFlags::DONT_FIXATE, which we need on the
# VideoModifier prop so Mutter/KWin recognise our offer as a
# multi-modifier DMA-BUF intent instead of falling through to SHM.
libspa = { version = "0.10", features = ["v0_3_33"] }
# Raw SPA constants (SPA_DATA_DmaBuf, SPA_PARAM_BUFFERS_dataType) that
# pipewire-rs 0.10's safe wrappers don't re-export. Pinned to the same
# version as libspa to avoid two sys-crate copies in the dep graph.
libspa-sys = "0.10"
# Raw libc::dup for cloning the DMA-BUF fd we receive from PipeWire so
# it outlives the per-callback Buffer borrow. OwnedFd::try_clone goes
# the same path with an extra Result wrap.
libc = "0.2"
tokio = { workspace = true }
# Used by ashpd's BitFlags types — adding directly lets us write
# `BitFlags::from(SourceType::Monitor)` without the bitor-with-self hack.
enumflags2 = "0.7"

[lints]
workspace = true
