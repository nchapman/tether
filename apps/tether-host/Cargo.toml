[package]
name = "tether-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tether host binary - the computer being viewed/controlled."

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true

tether-protocol = { workspace = true }
tether-transport = { workspace = true }
tether-capture = { workspace = true }
tether-codec = { workspace = true }
tether-input = { workspace = true }
tether-session = { workspace = true }
# Linux-only: BGRA→NV12 + DMA-BUF bridge for the zero-copy
# capture→encode path. The non-Linux build does CPU-side encode only.
[target.'cfg(target_os = "linux")'.dependencies]
tether-gpuconvert = { workspace = true }
# pollster::block_on lets us drive Nv12DmaBuf::new (async) from the
# synchronous send-thread context. Already a transitive dep through
# tether-gpuconvert; declared directly here to make the use explicit.
pollster = "0.4"

# dev-dep on tether-render so the macOS fourcc-table cross-check unit
# test (`macos_iosurface_fourcc_tables_agree_across_crates`) can call
# `tether_render::accepts_iosurface_fourcc` alongside the encoder /
# probe / capture accept tables. Production host binary does not link
# the renderer — that's a client-side concern.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tether-render = { workspace = true }

[lints]
workspace = true
