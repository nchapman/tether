[package]
name = "tether-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Wire protocol, message types, and timing structs for Tether."

[dependencies]
serde = { workspace = true }
# Pinned to a specific version: bincode 3.0 just released and we haven't
# vetted the API changes. Revisit when we're ready to migrate.
bincode = { version = "=2.0.1", features = ["serde"] }
# `bytes` is the payload type for video fragments — refcounted byte
# slices so the fragmenter can slice a frame body without copying, and
# the host send loop can hand encoded packets straight through to
# QUIC. The `serde` feature serializes `Bytes` as a byte sequence,
# wire-compatible with the prior `Vec<u8>` shape under bincode.
bytes = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }
tracing = { workspace = true }
prost = { workspace = true }
# Pure-Rust Reed-Solomon erasure coding over GF(2^8). Used to compute
# parity shards alongside the P-frame primary fragments so the receiver
# can recover from datagram loss without waiting on a fresh IDR. The
# encode work is bounded by data_shards * shard_size ≈ frame body size
# — dwarfed by the encoder's own per-frame cost.
reed-solomon-erasure = "6"

[build-dependencies]
prost-build = { workspace = true }
protoc-bin-vendored = { workspace = true }

[dev-dependencies]
# Random body sizes × random fragment drop masks for the fragmenter ↔
# reassembler property test. Hand-written cases stay in
# `src/lib.rs#mod tests`; the proptest covers loss-counter accuracy
# over the full state space rather than enumerated cases.
proptest = "1"

[lints]
workspace = true
