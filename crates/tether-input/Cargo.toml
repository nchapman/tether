[package]
name = "tether-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Input event capture (client) and injection (host) for keyboard, mouse, and cursor."

[dependencies]
tether-protocol = { workspace = true }
tether-render = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

# Linux host-side injection via libei (portal-mediated, same model as our
# PipeWire screen capture). enigo's libei_tokio feature integrates with
# the tokio runtime we already use. Other targets get a no-op injector.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["libei_tokio", "x11rb"] }
tokio = { workspace = true }

[lints]
workspace = true
