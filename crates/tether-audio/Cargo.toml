[package]
name = "tether-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Audio pipeline — system-output capture, Opus encode/decode, and playback."

[dependencies]
tether-protocol = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = { workspace = true }

# Cross-platform audio output (CoreAudio / WASAPI / ALSA-PipeWire) under one
# API — the playback side of every reference impl uses a single abstraction
# (Moonlight=SDL, RustDesk=cpal); capture stays per-platform because
# system-output capture is irreducibly OS-specific.
cpal = "0.17"

# Opus rides the same statically-linked LGPL FFmpeg 8.1 as the video codec
# (`tether-codec`) — libopus was added to the build in the 8.1.0-tether.4
# release. Keeping the rsmpeg dependency line identical to tether-codec's lets
# Cargo unify it to a single rusty_ffmpeg compilation, so FFmpeg is linked once
# into binaries that pull both crates. See crates/tether-codec/Cargo.toml for
# the linking rationale and build.rs for the Windows static-link wiring.
rsmpeg = { git = "https://github.com/Dryvnt/rsmpeg", rev = "4dcf6be81b87a200256763b31e5528fb0f21876e", features = ["ffmpeg8", "link_system_ffmpeg"] }

# macOS system-audio capture rides ScreenCaptureKit — the same framework the
# video path already uses (`tether-capture`), and the only native path to
# system output on macOS. Same crate + feature floor as tether-capture.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "6", features = ["macos_13_0"] }

[dev-dependencies]
# Loopback the Opus codec through the real `Datagram::Audio` wire channel,
# including the lossy variant that exercises gap-driven concealment.
tether-transport = { workspace = true, features = ["test-support"] }
tether-protocol = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
