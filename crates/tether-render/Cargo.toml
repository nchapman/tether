[package]
name = "tether-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client-side display: wgpu + winit, YUV->RGB shader, jitter buffer, present timing."

[dependencies]
tether-protocol = { workspace = true }
# Renderer takes ownership of decoder-emitted GPU frames (DMA-BUF
# descriptor + opaque drop guard whose Drop releases the VAAPI
# surface back to the hwframes pool). It only reads tether-codec's
# data shapes, never invokes the decoder.
tether-codec = { workspace = true }
# Mitchell-Netravali upscaler used when the client window is larger
# than the encoded video stream. Same shader the host uses on its
# downscale path, configured with the LinearF16 color space so it
# can consume the YUV→RGB pass's linear-light output directly
# without double-applying the sRGB transfer.
tether-scaler = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }

# wgpu 29 (latest crates.io release) has no DMA-BUF import path; PR #9366
# adds `texture_from_dmabuf_fd` on the Vulkan hal, which is required to
# replace `av_hwframe_transfer_data` on the decode side. Pin is by SHA
# rather than branch for reproducibility — `main` will move, the SHA
# won't. Workspace-level `[patch.crates-io]` keeps wgpu-{core,hal,types}
# on the same rev so we don't end up with two incompatible wgpu copies
# once another crate pulls them in.
# Migration trigger: drop the patch and bump to `version = "30"` once
# wgpu 30 ships with the new API.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9", features = ["vulkan", "metal"] }
winit = { workspace = true }
pollster = "0.4"

# macOS: hand-rolled FFI for the IOSurface→MTLTexture→wgpu texture
# path. Pinned to the exact objc2 ecosystem versions wgpu's metal
# backend pulls in so we don't end up with two incompatible copies
# of the Retained / ProtocolObject types — same pattern as the
# wgpu pin for the Vulkan DMA-BUF API.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# Cross-table consistency test in `dmabuf_test.rs` walks
# `PROFILE_PREFERENCE` so any future profile addition is automatically
# checked against `expected_dmabuf_fourcc`.
tether-probe = { workspace = true }
# Round-trip test harness pulls metrics, the Mitchell CPU reference,
# the coordinate-encoded fixture, and the chroma-roundtrip model from
# tether-scaler's test_util module — feature-gated to keep the
# production crate slim.
tether-scaler = { workspace = true, features = ["test-util"] }
# Load PNG fixtures for the photometric round-trip cells (the
# coordinate-encoded cells generate their fixture procedurally).
image = { version = "0.25", default-features = false, features = ["png"] }

# Linux-only test dep: the dmabuf renderer round-trip test for HEVC
# Main10 needs the production gpuconvert P010 bridge to produce a
# real 10-bit dma-buf the VAAPI encoder consumes via submit_dmabuf.
# Mirrors the macOS iosurface_test.rs pattern (which uses VT directly
# because VT takes BGRA IOSurfaces natively — no separate gpuconvert
# layer on macOS). Dev-only, doesn't pollute the production crate
# dependency graph.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tether-gpuconvert = { workspace = true }

# macOS dev-dep: the iosurface_test.rs host-scaler round-trip cell
# drives a captured IOSurface through tether-gpuconvert's
# nv12_iosurface bridge to verify the production downscale path
# (Stage 3 of the macOS GPU-scaling plan). Test-only — the renderer
# itself doesn't link the bridge.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tether-gpuconvert = { workspace = true }

[lints]
workspace = true
