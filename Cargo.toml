[workspace]
resolver = "2"
members = [
    "crates/tether-protocol",
    "crates/tether-transport",
    "crates/tether-capture",
    "crates/tether-codec",
    "crates/tether-gpuconvert",
    "crates/tether-input",
    "crates/tether-probe",
    "crates/tether-render",
    "crates/tether-scaler",
    "crates/tether-session",
    "crates/tether-vaapi",
    "apps/tether-host",
    "apps/tether-client",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
tether-protocol = { path = "crates/tether-protocol" }
tether-transport = { path = "crates/tether-transport" }
tether-capture = { path = "crates/tether-capture" }
tether-codec = { path = "crates/tether-codec" }
tether-gpuconvert = { path = "crates/tether-gpuconvert" }
tether-input = { path = "crates/tether-input" }
tether-probe = { path = "crates/tether-probe" }
tether-render = { path = "crates/tether-render" }
tether-scaler = { path = "crates/tether-scaler" }
tether-session = { path = "crates/tether-session" }
tether-vaapi = { path = "crates/tether-vaapi" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "signal", "io-util"] }
crossbeam-channel = "0.5"
socket2 = "0.5"
winit = "0.30"
async-trait = "0.1"

# Keep every wgpu sub-crate on the same trunk SHA as the top-level pin
# in tether-render. Without this, any future workspace member that
# depends on wgpu-core/hal/types via crates.io would pull a second,
# incompatible copy. See the comment in crates/tether-render/Cargo.toml.
[patch.crates-io]
wgpu-core = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9" }
wgpu-hal = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9" }
wgpu-types = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9" }
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "abort"

[profile.dev]
opt-level = 1
debug = "full"

[workspace.lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"

