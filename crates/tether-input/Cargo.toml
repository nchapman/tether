[package]
name = "tether-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Input event capture (client) and injection (host) for keyboard, mouse, and cursor."

[dependencies]
tether-protocol = { workspace = true }
tether-render = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

# Linux host-side injection via libei (portal-mediated, same model as our
# PipeWire screen capture). enigo's libei_tokio feature integrates with
# the tokio runtime we already use. We intentionally omit the x11rb
# feature: PipeWire capture is Wayland-anchored, so a Tether host can
# only meaningfully run under a portal-mediated Wayland session anyway,
# and dropping the X11 backend keeps enigo from logging an ERROR at
# startup as its X11 probe fails. Bring x11rb back behind a feature
# flag if an X11-only host turns out to be a real use case.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["libei_tokio"] }
tokio = { workspace = true }
# dup2 + open(/dev/null) to muzzle enigo 0.6.1's raw `println!("Start
# emulating")` on libei session init. Drop this dep once enigo demotes
# those lines to log!().
libc = "0.2"

# macOS uses enigo's CGEvent backend (always present, no feature flag
# needed). default-features = false drops the x11rb default feature;
# its sys-crate would not compile here anyway because enigo gates
# x11rb itself behind `cfg(all(unix, not(target_os = "macos")))`, but
# dropping the feature keeps the dep graph honest and avoids a stray
# x11rb resolution step on `cargo update`.
[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }
tokio = { workspace = true }

# Windows uses enigo's SendInput backend (compiled by default on
# Windows targets, no feature flag needed).
[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", default-features = false }
tokio = { workspace = true }

[lints]
workspace = true
