[package]
name = "tether-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codec trait + ffmpeg-backed encoders/decoders (H.264 first, HEVC and AV1 planned)."

[dependencies]
tether-protocol = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
bytes = { workspace = true }

# rsmpeg restores the originally-planned stack — safe wrappers around
# AVHWDeviceContext / AVHWFramesContext / hwframe_transfer_data are the
# whole reason to prefer it over ffmpeg-next when HW codecs land.
# Published rsmpeg 0.18 is built against FFmpeg 8.0; we're on FFmpeg 8.1,
# so we pin to Dryvnt's open PR adding 8.1 support
# (https://github.com/larksuite/rsmpeg/pull/252) by commit SHA — branch
# pins would break silently if the PR author force-pushes.
# Migration trigger: bump to `version = "0.19"` once PR #252 lands and a
# new rsmpeg version ships to crates.io.
rsmpeg = { git = "https://github.com/Dryvnt/rsmpeg", rev = "4dcf6be81b87a200256763b31e5528fb0f21876e", features = ["ffmpeg8", "link_system_ffmpeg"] }

# libva FFI for vaExportSurfaceHandle on the decode-side zero-copy
# path. Linux-only because VAAPI itself is.
[target.'cfg(target_os = "linux")'.dependencies]
tether-vaapi = { workspace = true }

# Hardware-gated round-trip tests need a real gpuconvert bridge to
# produce the dma-buf descriptor shape the encoder expects (XYUV for
# 4:4:4, NV12 for 4:2:0). Test-only — production code paths don't
# depend on gpuconvert from inside tether-codec.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tether-gpuconvert = { workspace = true }
# wgpu pinned to the same trunk SHA used elsewhere in the workspace.
# Test-only; production tether-codec doesn't link wgpu.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9", features = ["vulkan"] }
pollster = "0.4"

[lints]
workspace = true
