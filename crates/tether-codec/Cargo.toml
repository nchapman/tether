[package]
name = "tether-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codec trait + ffmpeg-backed encoders/decoders (H.264 first, HEVC and AV1 planned)."

[dependencies]
tether-protocol = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
bytes = { workspace = true }

# rsmpeg restores the originally-planned stack — safe wrappers around
# AVHWDeviceContext / AVHWFramesContext / hwframe_transfer_data are the
# whole reason to prefer it over ffmpeg-next when HW codecs land.
# Published rsmpeg 0.18 is built against FFmpeg 8.0; we're on FFmpeg 8.1,
# so we pin to Dryvnt's open PR adding 8.1 support
# (https://github.com/larksuite/rsmpeg/pull/252) by commit SHA — branch
# pins would break silently if the PR author force-pushes.
# Migration trigger: bump to `version = "0.19"` once PR #252 lands and a
# new rsmpeg version ships to crates.io.
rsmpeg = { git = "https://github.com/Dryvnt/rsmpeg", rev = "4dcf6be81b87a200256763b31e5528fb0f21876e", features = ["ffmpeg8", "link_system_ffmpeg"] }

# libva FFI for vaExportSurfaceHandle on the decode-side zero-copy
# path. Linux-only because VAAPI itself is.
[target.'cfg(target_os = "linux")'.dependencies]
tether-vaapi = { workspace = true }

# macOS-only IOSurface→MTLTexture→wgpu interop helpers. Shared by
# `tether-render` (client decode-side import) and `tether-gpuconvert`
# (host scaler-output import + destination allocation), so the
# IOSurface→wgpu plumbing has exactly one home. Moved here from
# `tether-render::gpu::metal` to avoid forcing the host bridge to
# depend on the renderer. Pinned versions match `tether-render`'s
# Cargo.toml so the workspace doesn't end up with two incompatible
# copies of `Retained` / `ProtocolObject`.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9", features = ["metal"] }
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef"] }

# Hardware-gated round-trip tests need a real gpuconvert bridge to
# produce the dma-buf descriptor shape the encoder expects (XYUV for
# 4:4:4, NV12 for 4:2:0). Test-only — production code paths don't
# depend on gpuconvert from inside tether-codec.
[target.'cfg(target_os = "linux")'.dev-dependencies]
tether-gpuconvert = { workspace = true }
# wgpu pinned to the same trunk SHA used elsewhere in the workspace.
# Test-only; production tether-codec doesn't link wgpu.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9", features = ["vulkan"] }
pollster = "0.4"

# Windows D3D11 Video Processor for the BGRA→NV12 blit in the encoder's
# encode_gpu path. Only the Video* interfaces are needed — the base
# device/texture types come through as raw pointers from tether-capture.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

# Tests create their own D3D11 device for hardware roundtrip validation.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
