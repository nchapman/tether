[package]
name = "tether-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Input event capture (client) and injection (host) for keyboard, mouse, and cursor."

[dependencies]
tether-protocol = { workspace = true }
tether-render = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

# Linux host-side injection via libei (portal-mediated, same model as our
# PipeWire screen capture). enigo's libei_tokio feature integrates with
# the tokio runtime we already use. We intentionally omit the x11rb
# feature: PipeWire capture is Wayland-anchored, so a Tether host can
# only meaningfully run under a portal-mediated Wayland session anyway,
# and dropping the X11 backend keeps enigo from logging an ERROR at
# startup as its X11 probe fails. Bring x11rb back behind a feature
# flag if an X11-only host turns out to be a real use case.
[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["libei_tokio"] }
tokio = { workspace = true }

[lints]
workspace = true
