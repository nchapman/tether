[package]
name = "tether-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Codec trait + ffmpeg-backed encoders/decoders (H.264 first, HEVC and AV1 planned)."

[dependencies]
tether-protocol = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
crossbeam-channel = { workspace = true }
bytes = { workspace = true }

# rsmpeg restores the originally-planned stack — safe wrappers around
# AVHWDeviceContext / AVHWFramesContext / hwframe_transfer_data are the
# whole reason to prefer it over ffmpeg-next when HW codecs land.
# Published rsmpeg 0.18 is built against FFmpeg 8.0; we're on FFmpeg 8.1,
# so we pin to Dryvnt's open PR adding 8.1 support
# (https://github.com/larksuite/rsmpeg/pull/252) by commit SHA — branch
# pins would break silently if the PR author force-pushes.
# Migration trigger: bump to `version = "0.19"` once PR #252 lands and a
# new rsmpeg version ships to crates.io.
#
# Linking: we statically link our own LGPL FFmpeg 8.1 from the
# nchapman/tether-ffmpeg releases. `scripts/fetch-ffmpeg.sh` stages it under
# vendor/ffmpeg/prefix and `.cargo/ffmpeg-env.toml` points rusty_ffmpeg at it
# (FFMPEG_PKG_CONFIG_PATH + FFMPEG_LINK_MODE=static); bindings are generated
# from those headers, so they track the linked libs exactly — no system 8.0/8.1
# drift. The `link_system_ffmpeg` feature is retained only as the env-less
# fallback (probe system pkg-config); it's inert whenever the env is staged.
rsmpeg = { git = "https://github.com/Dryvnt/rsmpeg", rev = "4dcf6be81b87a200256763b31e5528fb0f21876e", features = ["ffmpeg8", "link_system_ffmpeg"] }

# libva FFI for vaExportSurfaceHandle on the decode-side zero-copy
# path. Linux-only because VAAPI itself is.
[target.'cfg(target_os = "linux")'.dependencies]
tether-vaapi = { workspace = true }
# Runtime dlopen of libcuda.so.1 + libEGL.so.1 for the NVENC zero-copy
# DMA-BUF → CUDA import (EGLImage interop, see `nvenc::ffi`). dlopen rather
# than link-time so a non-NVIDIA host degrades gracefully (the loader
# returns None and the encoder falls back to the CPU upload path).
libloading = "0.8"
# NVDEC zero-copy decode (GH #16, D2): the decoder allocates a pool of NV12
# dma-buf surfaces and fills them from NVDEC's CUDA frame, so the renderer
# imports the dma-buf directly.
#
# We allocate the surfaces with raw Vulkan (`ash`) rather than reusing
# `tether-gpuconvert::export_nv12_shared_dmabuf`, because tether-codec
# depending on tether-gpuconvert would form a normal-dependency CYCLE:
# tether-gpuconvert already depends on tether-codec in production on macOS
# (IOSurface interop). resolver-2 evaluates the dependency graph cfg-merged,
# so the cross-platform mutual prod dependency is rejected even though the two
# edges never coexist on one target. A self-contained ash exporter in
# `nvdec::surface_pool` keeps the dependency acyclic. (`ash` 0.38 matches the
# version tether-gpuconvert pins.)
ash = "0.38"

# macOS-only IOSurface→MTLTexture→wgpu interop helpers. Shared by
# `tether-render` (client decode-side import) and `tether-gpuconvert`
# (host scaler-output import + destination allocation), so the
# IOSurface→wgpu plumbing has exactly one home. Moved here from
# `tether-render::gpu::metal` to avoid forcing the host bridge to
# depend on the renderer. Pinned versions match `tether-render`'s
# Cargo.toml so the workspace doesn't end up with two incompatible
# copies of `Retained` / `ProtocolObject`.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9", features = ["metal"] }
objc2 = "0.6.3"
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef"] }

# Hardware-gated round-trip tests need a real gpuconvert bridge to
# produce the dma-buf descriptor shape the encoder expects (XYUV for
# 4:4:4, NV12 for 4:2:0). Test-only — and crucially a *dev*-dependency,
# which lets cargo tolerate the tether-codec ↔ tether-gpuconvert cycle
# here (production tether-codec uses raw `ash` for its NVDEC surface pool
# instead; see the dependencies block above).
[target.'cfg(target_os = "linux")'.dev-dependencies]
tether-gpuconvert = { workspace = true }
# wgpu pinned to the same trunk SHA used elsewhere in the workspace.
# Test-only; production tether-codec doesn't link wgpu.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "9d31bca9", features = ["vulkan"] }
pollster = "0.4"

# Windows D3D11 Video Processor for the BGRA→NV12 blit in the encoder's
# encode_gpu path. Only the Video* interfaces are needed — the base
# device/texture types come through as raw pointers from tether-capture.
[target.'cfg(target_os = "windows")'.dependencies]
# Runtime dlopen of nvcuda.dll to read NVIDIA GPU compute capability, gating
# `av1_nvenc` on Ada+ hardware before FFmpeg init (see `d3d11::nvenc_caps`).
# dlopen rather than link-time so a non-NVIDIA host has no CUDA dependency.
libloading = "0.8"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # IDXGIResource1::CreateSharedHandle takes an Option<*const
    # SECURITY_ATTRIBUTES>; that param type lives behind Win32_Security,
    # so the method is cfg'd out without this feature.
    "Win32_Security",
] }

# Tests create their own D3D11 device for hardware roundtrip validation.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # Tests enumerate DXGI adapters (IDXGIFactory1::EnumAdapters1) to bind a
    # device to a specific GPU vendor for the per-vendor roundtrip tests.
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[lints]
workspace = true
