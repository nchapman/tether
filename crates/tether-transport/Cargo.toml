[package]
name = "tether-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport trait + quinn (QUIC) implementation for Tether."

[dependencies]
tether-protocol = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

async-trait = { workspace = true }
quinn = "0.11"
socket2 = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = "0.14"
sha2 = "0.11"

# Only pulled in when `test-support` is enabled. SmallRng + seedable
# RNG drive the `LossyChannel` deterministic loss simulator. Marked
# `optional` so production builds never compile rand.
rand = { version = "0.9", features = ["small_rng"], optional = true }

# Windows owner-only file ACLs for the persisted identity key (the analogue of
# the Unix `0o600` we set on `*_key.der`). See `tls::write_key_file`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[features]
# Exposes `test_support::DuplexControlChannel` for downstream crates'
# integration tests. The feature gates only the items inside the
# `test_support` module — never modifies the public API of anything
# else in this crate. Downstream crates enable it under
# `[dev-dependencies]`.
#
# `async-trait` itself ships unconditionally: the real `Connection`'s
# `ControlChannel` / `InputChannel` / `VideoChannel` impls use it, so
# it has to be in `[dependencies]` (not gated behind this feature).
# That's fine — `async-trait` is a proc-macro that emits ordinary
# code; there's no runtime cost in release builds.
test-support = ["dep:rand"]

[dev-dependencies]
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
# Drives a real SPAKE2 pairing exchange in the PendingConnection loopback test.
tether-pairing = { workspace = true }
tether-protocol = { workspace = true }

[lints]
workspace = true
