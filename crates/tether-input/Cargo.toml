[package]
name = "tether-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Input event capture (client) and injection (host) for keyboard, mouse, and cursor."

[dependencies]
tether-protocol = { workspace = true }
tether-render = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }

# Linux host-side injection via /dev/uinput (the `evdev` crate's pure-Rust
# uinput builder — no libevdev C dependency). We deliberately do NOT route
# input through the RemoteDesktop portal/libei: that portal re-prompts on
# every session and its restore-token support is unreliable across
# compositors, which is a non-starter for unattended remote access. uinput
# has no portal and therefore no prompt once /dev/uinput is accessible
# (see `tether-host --setup-input`). This mirrors what the mature Wayland
# hosts (Sunshine, rustdesk server mode) ship.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
tokio = { workspace = true }

# macOS uses enigo's CGEvent backend (always present, no feature flag
# needed). default-features = false drops the x11rb default feature;
# its sys-crate would not compile here anyway because enigo gates
# x11rb itself behind `cfg(all(unix, not(target_os = "macos")))`, but
# dropping the feature keeps the dep graph honest and avoids a stray
# x11rb resolution step on `cargo update`.
[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }
tokio = { workspace = true }

# Windows uses enigo's SendInput backend (compiled by default on
# Windows targets, no feature flag needed).
[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", default-features = false }
tokio = { workspace = true }

[lints]
workspace = true
