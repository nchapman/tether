name: Release

# Push a version tag (e.g. `v0.1.0`) to build, sign, and publish installers.
# See docs/RELEASING.md for the bump → commit → tag flow.
on:
  push:
    tags:
      - "v*"

# tauri-action needs write access to create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    name: bundle & publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The Tauri shell links the webview/GTK toolkit on Linux to bundle.
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev

      # Build the engines and stage them as Tauri sidecars so the bundler
      # (via tauri.release.conf.json's externalBin) installs them next to the
      # app binary.
      - name: Build engines
        run: cargo build --release -p tether-host -p tether-client

      - name: Stage engine sidecars
        shell: bash
        run: scripts/stage-engine-binaries.sh

      - name: Install frontend dependencies
        run: pnpm --dir apps/tether-shell install --frozen-lockfile

      - name: Build, sign, and publish bundle
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater manifest (latest.json + per-bundle .sig). Without
          # these the build still produces installers, but auto-update is unsigned
          # and the client will reject it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/tether-shell
          tagName: ${{ github.ref_name }}
          releaseName: "Tether ${{ github.ref_name }}"
          # Draft so a human reviews artifacts before publishing. The updater
          # endpoint (releases/latest) only resolves once the release is
          # published and non-prerelease.
          releaseDraft: true
          prerelease: false
          # Merge two release-only configs (paths relative to projectPath):
          #   - tauri.release.conf.json adds the engine sidecars (externalBin),
          #     kept out of the base config so `tauri dev` / CI / keyless
          #     `make package` don't need staged engines.
          #   - tauri.updater.conf.json enables createUpdaterArtifacts, which
          #     requires the signing key — only layered on here, where it's set.
          args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json
